version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    commit-message:
      prefix: build
      prefix-development: chore
      include: scope
    schedule:
      interval: daily
    groups:
      clerk:
        patterns: ["com.clerk:*"]
      kotlin:
        patterns: ["org.jetbrains.kotlin*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
